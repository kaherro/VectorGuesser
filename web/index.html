<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Vector Guesser</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<div id="game-window">
    <div id="settings-section">
        <div id="game-info">
            <img src="favicon.ico" id="game-logo">
            <div>
                <div id="game-name">Vector Guesser</div>
                <div id="game-subtitle">GEOGRAPHY GAME</div>
            </div>
        </div>
        <div id="options">
            <div id="difficulty-select">
                <div class="difficulty-option active" data-value="easy">Easy</div>
                <div class="difficulty-option" data-value="medium">Medium</div>
                <div class="difficulty-option" data-value="hard">Hard</div>
            </div>
            <label id="capitals-switch">
                <input type="checkbox" id="capitals-only-checkbox">
                <span id="capitals-slider"></span>
            </label>
            <div id="capitals-label">Capitals only</div>
            <button id="start-game-button">Start Game</button>
        </div>
    </div>
    <div id="main-game-area">
        <div id="guess-section">
            <div>
                <div id="start-city-label">START CITY</div>
                <div id="start-city">—</div>
            </div>
            <div id="compass-box">
                <div id="compass">
                    <div id="compass-circle" style="--deg:-45deg">
                        <span class="card n">N</span>
                        <span class="card e">E</span>
                        <span class="card s">S</span>
                        <span class="card w">W</span>
                        <div class="c-dot"></div>
                    </div>
                </div>
                <div id="vec-dir">— —</div>
                <div id="vec-dist">Distance: —</div>
            </div>
            <div id="stats">
                <div class="stats-item">
                    <div class="guess-label">Attempts</div>
                    <div id="attempts-number" class="attempts-number green">10</div>
                </div>
                <div class="stats-item">
                    <div class="guess-label">Guessed</div>
                    <div id="guessed-number">0</div>
                </div>
            </div>
            <div>
                <div class="guess-label">Attempts left</div>
                <div id="pips">
                    <div class="pip on"></div>
                    <div class="pip on"></div>
                    <div class="pip on"></div>
                    <div class="pip on"></div>
                    <div class="pip on"></div>
                    <div class="pip on"></div>
                    <div class="pip on"></div>
                    <div class="pip on"></div>
                    <div class="pip on"></div>
                    <div class="pip on"></div>
                </div>
            </div>
            <div id="guess-input">
                <div class="guess-label">Your answer</div>
                <input id="input-field" class="input-field" type="text" placeholder="Type a city name..." disabled="" autocomplete="off">
                <div id="dropdown-list" class="dropdown-content hidden"></div>
                <button id="check-button" class="check-button" disabled="">Check →</button>
            </div>
        </div>
        <div id="map"></div>
    </div>
    <div id="bottom-info">
        <div class="message" id="message">Choose settings and press «Start game»</div>
        <div id="score"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
<script src="script.js"></script>
</body>
</html>
